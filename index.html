<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LanBridge</title>
<style>
  :root {
    --bg: #f4f6f8; --bg-card: #fff; --bg-subtle: #f2f2f7; --bg-input: #f9f9fb;
    --text: #24292f; --text-muted: var(--text-muted); --text-dim: #8e8e93;
    --border: var(--border); --border-light: var(--border-light); --border-chat: #e5e5ea;
    --accent: #0969da; --accent-hover: #0a58b5; --accent-active: #0860ca;
    --accent-chat: #007aff; --accent-chat-hover: #0066d6;
    --green: #1a7f37; --green-light: #34c759;
    --chat-bubble-other: #e9e9eb; --chat-text-other: #000;
    --toast-bg: #1f2328; --shadow: rgba(0,0,0,0.06);
    --progress-bg: var(--border-light); --meter-bg: var(--border-light);
    --speed-chart-bg: #f6f8fa;
  }
  .dark {
    --bg: #0d1117; --bg-card: #161b22; --bg-subtle: #1c2128; --bg-input: #1c2128;
    --text: #e6edf3; --text-muted: #8b949e; --text-dim: #6e7681;
    --border: #30363d; --border-light: #21262d; --border-chat: #30363d;
    --accent: #58a6ff; --accent-hover: #79c0ff; --accent-active: #a5d6ff;
    --accent-chat: #58a6ff; --accent-chat-hover: #79c0ff;
    --green: #3fb950; --green-light: #56d364;
    --chat-bubble-other: #21262d; --chat-text-other: #e6edf3;
    --toast-bg: #30363d; --shadow: rgba(0,0,0,0.3);
    --progress-bg: #21262d; --meter-bg: #21262d;
    --speed-chart-bg: #161b22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.7; padding: 24px;
  }
  .page { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .theme-toggle {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: background .15s; flex-shrink: 0;
  }
  .theme-toggle:hover { background: var(--bg-subtle); }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
  }
  .toolbar .hint { font-size: 12px; color: var(--text-muted); }
  .btn {
    border: none;
    border-radius: 6px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    transition: background .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.done { background: var(--green); }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: var(--toast-bg);
    color: #fff;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .group-title {
    font-size: 14px;
    font-weight: 600;
    margin: 14px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-title .count { font-size: 12px; color: var(--text-muted); font-weight: normal; }
  .file-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .file-info { min-width: 0; flex: 1; }
  .file-name { font-weight: 600; word-break: break-all; font-size: 13.5px; }
  .file-meta { font-size: 12px; color: var(--text-muted); }
  .file-hash { font-size: 11px; color: var(--text-muted); word-break: break-all; margin-top: 2px; }
  .file-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .file-actions .btn { padding: 5px 12px; font-size: 12.5px; }
  .upload-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .upload-tip { font-size: 12px; color: var(--text-muted); }
  .upload-progress {
    height: 6px;
    background: var(--border-light);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
    display: none;
  }
  .upload-progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  @media (max-width: 560px) {
    body { padding: 12px; }
    .file-actions { width: 100%; justify-content: flex-end; }
    .upload-bar .btn { flex: 1; }
    .speed-row { gap: 8px; }
  }
  .speed-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .speed-title { font-weight: 600; margin-bottom: 8px; }
  .speed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .speed-result { font-size: 13px; color: var(--text); min-width: 0; }
  .sel {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
    background: var(--bg-card);
    color: var(--text);
  }
  .host-input {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
    width: 140px;
    background: var(--bg-card);
    color: var(--text);
  }
  .speed-meter {
    height: 6px;
    background: var(--meter-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .meter-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .2s;
  }
  .speed-chart {
    display: block;
    width: 100%;
    height: 130px;
    margin-top: 10px;
    background: var(--speed-chart-bg);
    border-radius: 6px;
  }
  .speed-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
  .chart-tip {
    position: fixed;
    pointer-events: none;
    background: var(--toast-bg);
    color: #fff;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .1s;
    z-index: 10;
  }
  .chart-tip.show { opacity: 1; }

  /* ===== 聊天区 ===== */
  #chatSection { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 12px; padding: 0; margin-bottom: 16px; overflow: hidden; }
  #chatSection h2 { font-size: 17px; padding: 14px 16px 0; margin: 0; }
  #chatStatus { font-size: 12px; color: var(--text-dim); padding: 4px 16px 8px; }
  #chatStatus .online { color: var(--green-light); }
  #chatMessages {
    height: 360px; overflow-y: auto; padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 2px;
    background: var(--bg-card); border-top: 1px solid var(--border-chat); border-bottom: 1px solid var(--border-chat);
  }
  .chat-time-sep { text-align: center; font-size: 11px; color: var(--text-dim); padding: 10px 0 6px; }
  .chat-msg-row { display: flex; align-items: flex-start; gap: 8px; max-width: 85%; }
  .chat-msg-row.mine { flex-direction: row-reverse; margin-left: auto; }
  .chat-msg-row.theirs { margin-right: auto; }
  .chat-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: #fff; margin-top: 2px;
  }
  .chat-bubble-wrap { display: flex; flex-direction: column; }
  .chat-name { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
  .chat-msg-row.mine .chat-name { text-align: right; }
  .chat-bubble {
    padding: 8px 12px; border-radius: 18px; font-size: 14px; line-height: 1.45;
    word-break: break-word; position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .chat-msg-row.mine .chat-bubble {
    background: var(--accent-chat); color: #fff; border-bottom-right-radius: 4px;
  }
  .chat-msg-row.theirs .chat-bubble {
    background: var(--chat-bubble-other); color: var(--chat-text-other); border-bottom-left-radius: 4px;
  }
  .chat-bubble .chat-time { font-size: 10px; opacity: 0.55; margin-top: 4px; display: block; }
  .chat-msg-row.mine .chat-time { text-align: right; }
  .chat-images { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chat-img-wrap { position: relative; display: inline-block; line-height: 0; }
  .chat-img-wrap img {
    max-width: 220px; max-height: 200px; border-radius: 10px; object-fit: cover; cursor: pointer;
    display: block;
  }
  .chat-img-copy {
    position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,0.45); color: #fff; border: none; cursor: pointer;
    font-size: 12px; display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .chat-img-wrap:hover .chat-img-copy { display: flex; }
  .chat-img-copy.copied { background: #34c759; }
  .chat-img-unsupported {
    padding: 12px 14px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 10px;
    font-size: 12px; color: var(--text-dim); max-width: 220px;
  }
  #chatForm {
    display: flex; gap: 8px; padding: 10px 12px; background: var(--bg-input); align-items: center;
  }
  #chatInput {
    flex: 1; border: 1px solid var(--border); border-radius: 20px; padding: 8px 14px;
    font-size: 14px; outline: none; background: var(--bg-card); color: var(--text);
  }
  #chatInput:focus { border-color: var(--accent-chat); box-shadow: 0 0 0 2px rgba(0,122,255,0.15); }
  #chatImgBtn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--bg-card); font-size: 18px; cursor: pointer; color: var(--accent-chat);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #chatImgBtn:hover { background: var(--bg-subtle); }
  .chat-send-btn {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: var(--accent-chat); color: #fff; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .chat-send-btn:hover { background: var(--accent-chat-hover); }
  .chat-send-btn:disabled { background: var(--text-dim); cursor: not-allowed; }
  .chat-preview-bar {
    display: flex; gap: 6px; padding: 6px 12px 0; background: var(--bg-input); flex-wrap: wrap;
  }
  .chat-preview-thumb {
    position: relative; width: 48px; height: 48px; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .chat-preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .chat-preview-thumb .chat-preview-remove {
    position: absolute; top: 0; right: 0; width: 16px; height: 16px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: none; font-size: 10px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* ===== 系统信息 / 管理 ===== */
  .info-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .info-card h2 { font-size: 17px; margin-bottom: 10px; }
  .info-table { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 13px; }
  .info-table .k { color: var(--text-muted); white-space: nowrap; }
  .info-table .v { color: var(--text); word-break: break-all; user-select: all; }
  .admin-card { background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .admin-card h2 { font-size: 17px; margin-bottom: 10px; }
  .perm-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  @media (max-width: 600px) { .perm-list { grid-template-columns: 1fr; } }
  .perm-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .perm-row .name { flex: 1; color: var(--text); }
  .perm-row .name small { color: var(--text-muted); display: block; font-size: 11px; }
  .perm-row .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .perm-row .switch input { display: none; }
  .perm-row .switch .slider {
    position: absolute; inset: 0; background: var(--text-dim); border-radius: 11px; cursor: pointer; transition: background .15s;
  }
  .perm-row .switch .slider::before {
    content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px;
    background: #fff; border-radius: 50%; transition: transform .15s;
  }
  .perm-row .switch input:checked + .slider { background: var(--green-light); }
  .perm-row .switch input:checked + .slider::before { transform: translateX(18px); }
  .perm-row.disabled { opacity: 0.5; }
  .perm-row .switch .slider { cursor: not-allowed; }

  @media (max-width: 600px) {
    body { padding: 12px; }
    #chatMessages { height: 280px; }
    .chat-msg-row { max-width: 95%; }
    .chat-img-wrap img { max-width: 180px; max-height: 160px; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="title-row">
    <h1>LanBridge</h1>
    <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">☀</button>
  </div>

  <!-- ============ 实时聊天区 ============ -->
  <section id="chatSection">
    <h2>💬 实时聊天</h2>
    <div id="chatStatus">连接中…</div>
    <div id="chatMessages"></div>
    <div class="chat-preview-bar" id="chatPreviewBar"></div>
    <form id="chatForm">
      <input type="file" id="chatImgInput" multiple accept="image/*" style="display:none">
      <button type="button" id="chatImgBtn" title="选择图片">+</button>
      <input id="chatInput" placeholder="输入消息，按 Enter 发送" maxlength="200">
      <button type="submit" class="chat-send-btn" title="发送">▶</button>
    </form>
  </section>
  <!-- ============ 实时聊天区结束 ============ -->

  <!-- ============ 系统信息 ============ -->
  <section class="info-card" id="infoCard">
    <h2>ℹ️ 系统信息</h2>
    <div class="info-table" id="infoTable">
      <span class="k">局域网 IP</span><span class="v" id="infoIps">-</span>
      <span class="k">端口</span><span class="v" id="infoPort">-</span>
      <span class="k">主机名</span><span class="v" id="infoHost">-</span>
      <span class="k">操作系统</span><span class="v" id="infoPlatform">-</span>
      <span class="k">Node.js</span><span class="v" id="infoNode">-</span>
      <span class="k">当前地址</span><span class="v" id="infoUrl">-</span>
      <span class="k">客户端 IP</span><span class="v" id="infoClientIp">-</span>
      <span class="k">浏览器</span><span class="v" id="infoUA">-</span>
    </div>
  </section>
  <!-- ============ 系统信息结束 ============ -->

  <!-- ============ 本机管理（仅 localhost 可见，由 JS 渲染） ============ -->
  <div id="adminMount"></div>
  <!-- ============ 本机管理结束 ============ -->

  <hr style="border:none; border-top:1px solid var(--border); margin:28px 0 20px;">

  <!-- ============ 下载区：支持子文件夹（最深 3 层），也可用下方上传区添加文件 ============ -->
  <h2 style="font-size:17px; margin-bottom:8px;">下载区</h2>
  <p class="subtitle">文件放在 index.html 同目录（支持子文件夹，最深 3 层）或使用下方上传，刷新页面后自动列出</p>
  <div id="fileGroups">
    <div class="text-block" style="color:var(--text-muted); font-size:13px; text-align:center; padding:18px;">加载中...</div>
  </div>
  <!-- ============ 下载区结束 ============ -->

  <hr style="border:none; border-top:1px solid var(--border); margin:28px 0 20px;">

  <!-- ============ 上传回传区 ============ -->
  <h2 style="font-size:17px; margin-bottom:8px;">上传回传</h2>
  <p class="subtitle">把文件上传到服务器共享目录（新系统 → 主机方向传输），上传后自动出现在下载区</p>
  <div class="upload-bar">
    <button class="btn" id="pickFiles">选择文件（可多选）</button>
    <button class="btn" id="pickFolder">选择文件夹</button>
    <input type="file" id="fileInput" multiple style="display:none;">
    <input type="file" id="dirInput" webkitdirectory multiple style="display:none;">
    <span class="upload-tip" id="uploadResult"></span>
  </div>
  <div class="upload-progress"><div class="upload-progress-bar" id="uploadBar"></div></div>
  <!-- ============ 上传回传区结束 ============ -->

  <hr style="border:none; border-top:1px solid var(--border); margin:28px 0 20px;">

  <!-- ============ 网速测试区 ============ -->
  <h2 style="font-size:17px; margin-bottom:8px;">网速测试</h2>
  <p class="subtitle">测的是「当前浏览器 → 本服务器」的真实链路。测试期间请勿进行其他大流量操作。</p>

  <div class="speed-card">
    <div class="speed-title">延迟（Ping）</div>
    <div class="speed-row">
      <button class="btn" id="pingLocalBtn">测本服务器延迟</button>
      <span class="speed-result" id="pingLocalResult">-</span>
    </div>
    <div class="speed-row">
      <select class="sel" id="extHost"></select>
      <input class="host-input" id="extHostCustom" placeholder="自定义域名如 example.com">
      <button class="btn" id="pingExtBtn">测外网延迟</button>
      <span class="speed-result" id="pingExtResult">-</span>
    </div>
  </div>

  <div class="speed-card">
    <div class="speed-title">下载速度</div>
    <div class="speed-row">
      <label style="font-size:13px; color:var(--text-muted);">时长</label>
      <select class="sel" id="dlSecs">
        <option value="5">5 秒</option>
        <option value="10" selected>10 秒</option>
        <option value="30">30 秒</option>
      </select>
      <button class="btn" id="dlBtn">开始下载测速</button>
      <span class="speed-result" id="dlResult">-</span>
    </div>
    <div class="speed-meter"><div class="meter-bar" id="dlBar"></div></div>
    <canvas class="speed-chart" id="dlChart"></canvas>
    <div class="speed-meta" id="dlMeta"></div>
  </div>

  <div class="speed-card">
    <div class="speed-title">上传速度</div>
    <div class="speed-row">
      <label style="font-size:13px; color:var(--text-muted);">时长</label>
      <select class="sel" id="ulSecs">
        <option value="5">5 秒</option>
        <option value="10" selected>10 秒</option>
        <option value="30">30 秒</option>
      </select>
      <button class="btn" id="ulBtn">开始上传测速</button>
      <span class="speed-result" id="ulResult">-</span>
    </div>
    <div class="speed-meter"><div class="meter-bar" id="ulBar"></div></div>
    <canvas class="speed-chart" id="ulChart"></canvas>
    <div class="speed-meta" id="ulMeta"></div>
  </div>
  <!-- ============ 网速测试区结束 ============ -->
</div>

<div class="toast" id="toast"></div>
<div class="chart-tip" id="chartTip"></div>

<script>
  // ============ 主题切换 ============
  ;(() => {
    const THEME_KEY = 'wcs_theme'
    const html = document.documentElement
    const toggle = document.getElementById('themeToggle')

    function getPreferred() {
      const saved = localStorage.getItem(THEME_KEY)
      if (saved === 'dark' || saved === 'light') return saved
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }

    function apply(theme) {
      if (theme === 'dark') {
        document.body.classList.add('dark')
        toggle.textContent = '☾'
        toggle.title = '切换到浅色模式'
      } else {
        document.body.classList.remove('dark')
        toggle.textContent = '☀'
        toggle.title = '切换到深色模式'
      }
    }

    apply(getPreferred())

    toggle.addEventListener('click', () => {
      const next = document.body.classList.contains('dark') ? 'light' : 'dark'
      localStorage.setItem(THEME_KEY, next)
      apply(next)
    })

    // 监听系统主题变化（仅在用户未手动选择时响应）
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem(THEME_KEY)) {
        apply(e.matches ? 'dark' : 'light')
      }
    })
  })()

  // 复制文本到剪贴板（局域网 http 下 navigator.clipboard 不可用，
  // 因此使用隐藏 textarea + execCommand 方案，任何浏览器都稳定可用）
  function copyText(text) {
    const ta = document.createElement('textarea')
    ta.value = text
    ta.style.position = 'fixed'
    ta.style.opacity = '0'
    ta.style.pointerEvents = 'none'
    document.body.appendChild(ta)
    ta.focus()
    ta.select()
    ta.setSelectionRange(0, ta.value.length)
    let ok = false
    try {
      ok = document.execCommand('copy')
    } catch (e) {
      ok = false
    }

  // ============ 下载区：目录树分组渲染 + 哈希/预览 ============
  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B'
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB'
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + ' MB'
    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB'
  }

  // 把目录树平铺为 [{ group, path, name, size }]，group = 顶层目录名
  function flattenTree(tree) {
    const out = []
    function walk(node, prefix, topGroup) {
      for (const f of node.files || []) {
        out.push({ group: topGroup || '根目录', path: prefix ? prefix + '/' + f.name : f.name, name: f.name, size: f.size })
      }
      for (const d of node.dirs || []) {
        walk(d, prefix ? prefix + '/' + d.name : d.name, topGroup || d.name)
      }
    }
    walk(tree, '', '')
    return out
  }

  function doUpload(fileList) {
    const files = Array.from(fileList)
    if (!files.length) return
    const totalBytes = files.reduce((a, f) => a + f.size, 0)
    const progressWrap = document.querySelector('.upload-progress')
    const bar = document.getElementById('uploadBar')
    const resultEl = document.getElementById('uploadResult')
    progressWrap.style.display = 'block'
    bar.style.width = '0%'
    let doneBytes = 0
    let okCount = 0
    const failed = []
    let cancelled = false

    // 串行逐个上传（保持服务器写入简单，局域网吞吐足够）
    const queue = files.slice()
    const next = () => {
      if (cancelled || !queue.length) {
        progressWrap.style.display = 'none'
        resultEl.textContent = cancelled
          ? '已取消'
          : (failed.length ? '完成：成功 ' + okCount + ' 个，失败 ' + failed.length + ' 个（' + failed.slice(0, 3).join('、') + '）'
            : '已上传 ' + okCount + ' 个文件 ✓')
        if (okCount > 0) loadDownloads()
        return
      }
      const f = queue.shift()
      const rel = f.webkitRelativePath || f.name
      resultEl.textContent = '上传中 (' + (files.length - queue.length) + '/' + files.length + ') ' + rel
      const xhr = new XMLHttpRequest()
      xhr.open('PUT', '/upload/' + encodeURIComponent(rel))
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const cur = doneBytes + e.loaded
          bar.style.width = Math.round(cur / totalBytes * 100) + '%'
        }
      }
      xhr.onload = () => {
        doneBytes += f.size
        if (xhr.status === 200) okCount++
        else failed.push(rel)
        next()
      }
      xhr.onerror = () => { doneBytes += f.size; failed.push(rel); next() }
      xhr.send(f)
    }
    next()
  }

  // ============ 速度曲线图（零依赖 canvas 手绘） ============
  function niceCeil(v) {
    const pow = Math.pow(10, Math.floor(Math.log10(v)))
    if (v <= pow) return pow
    if (v <= 2 * pow) return 2 * pow
    if (v <= 5 * pow) return 5 * pow
    return 10 * pow
  }
  function niceStep(v) {
    const pow = Math.pow(10, Math.floor(Math.log10(v)))
    for (const m of [1, 2, 5, 10]) {
      if (v <= m * pow) return m * pow
    }
    return 10 * pow
  }

  // points: [{tSec, mbps}]，color 为折线主色，悬停显示该点速率
  function drawChart(canvas, points, color) {
    const tip = document.getElementById('chartTip')
    const dpr = window.devicePixelRatio || 1
    const w = canvas.clientWidth || 320
    const h = 130
    canvas.width = Math.round(w * dpr)
    canvas.height = Math.round(h * dpr)
    canvas.style.width = w + 'px'
    canvas.style.height = h + 'px'
    const ctx = canvas.getContext('2d')
    ctx.scale(dpr, dpr)

    const mL = 40, mR = 8, mT = 10, mB = 22
    const pw = w - mL - mR
    const ph = h - mT - mB
    const maxY = points.length ? Math.max(niceCeil(Math.max(...points.map(p => p.mbps)) * 1.15), 1) : 1
    const maxX = points.length ? Math.max(points[points.length - 1].tSec, 1) : 1
    const px = (t) => mL + t / maxX * pw
    const py = (v) => mT + ph - v / maxY * ph

    const render = (idx) => {
      const cssVar = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim()
      ctx.clearRect(0, 0, w, h)
      if (points.length < 2) {
        ctx.fillStyle = cssVar('--text-muted')
        ctx.font = '12px sans-serif'
        ctx.textAlign = 'center'
        ctx.fillText('数据不足，无法绘制曲线', w / 2, h / 2)
        return
      }
      ctx.strokeStyle = cssVar('--border-light')
      ctx.fillStyle = cssVar('--text-muted')
      ctx.font = '10px sans-serif'
      ctx.textAlign = 'right'
      for (let i = 0; i <= 4; i++) {
        const v = maxY * i / 4
        const y = py(v)
        ctx.beginPath()
        ctx.moveTo(mL, y)
        ctx.lineTo(w - mR, y)
        ctx.stroke()
        ctx.fillText(v.toFixed(0), mL - 4, y + 3)
      }
      ctx.textAlign = 'center'
      const step = niceStep(maxX / 4)
      for (let t = 0; t <= maxX + 1e-9; t += step) {
        ctx.beginPath()
        ctx.moveTo(px(t), mT + ph)
        ctx.lineTo(px(t), mT + ph + 4)
        ctx.stroke()
        ctx.fillText(t.toFixed(0) + 's', px(t), h - 6)
      }
      const last = points[points.length - 1]
      const grad = ctx.createLinearGradient(0, mT, 0, mT + ph)
      grad.addColorStop(0, color + '45')
      grad.addColorStop(1, color + '05')
      ctx.beginPath()
      points.forEach((p, i) => {
        i === 0 ? ctx.moveTo(px(p.tSec), py(p.mbps)) : ctx.lineTo(px(p.tSec), py(p.mbps))
      })
      ctx.lineTo(px(last.tSec), py(0))
      ctx.lineTo(px(points[0].tSec), py(0))
      ctx.closePath()
      ctx.fillStyle = grad
      ctx.fill()
      ctx.beginPath()
      points.forEach((p, i) => {
        i === 0 ? ctx.moveTo(px(p.tSec), py(p.mbps)) : ctx.lineTo(px(p.tSec), py(p.mbps))
      })
      ctx.strokeStyle = color
      ctx.lineWidth = 2
      ctx.lineJoin = 'round'
      ctx.stroke()

      if (idx >= 0 && points[idx]) {
        const p = points[idx]
        ctx.beginPath()
        ctx.moveTo(px(p.tSec), mT)
        ctx.lineTo(px(p.tSec), mT + ph)
        ctx.strokeStyle = cssVar('--border')
        ctx.lineWidth = 1
        ctx.stroke()
        ctx.beginPath()
        ctx.arc(px(p.tSec), py(p.mbps), 4, 0, Math.PI * 2)
        ctx.fillStyle = color
        ctx.fill()
        ctx.strokeStyle = cssVar('--bg-card')
        ctx.lineWidth = 1.5
        ctx.stroke()
      } else {
        let peak = points[0]
        points.forEach(p => { if (p.mbps > peak.mbps) peak = p })
        ctx.beginPath()
        ctx.arc(px(peak.tSec), py(peak.mbps), 3.5, 0, Math.PI * 2)
        ctx.fillStyle = '#cf222e'
        ctx.fill()
        ctx.strokeStyle = cssVar('--bg-card')
        ctx.lineWidth = 1.5
        ctx.stroke()
      }
    }

    render(-1)
    canvas.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect()
      const t = (e.clientX - rect.left) / pw * maxX
      let best = 0
      let bestD = Infinity
      points.forEach((p, i) => {
        const d = Math.abs(p.tSec - t)
        if (d < bestD) { bestD = d; best = i }
      })
      render(best)
      const p = points[best]
      tip.textContent = '第 ' + p.tSec.toFixed(1) + ' 秒 · ' + p.mbps.toFixed(1) + ' Mbps'
      tip.style.left = (e.clientX + 12) + 'px'
      tip.style.top = (e.clientY - 34) + 'px'
      tip.classList.add('show')
    }
    canvas.onmouseleave = () => {
      render(-1)
      tip.classList.remove('show')
    }
  }

  // 采样点 → 区间速率曲线数据
  function samplesToPoints(samples) {
    const points = []
    for (let i = 1; i < samples.length; i++) {
      const dt = samples[i].t - samples[i - 1].t
      if (dt <= 0) continue
      points.push({
        tSec: samples[i].t / 1000,
        mbps: (samples[i].bytes - samples[i - 1].bytes) * 8 * 1000 / dt / 1e6,
      })
    }
    return points
  }

    // 流式下载：边读边丢，内存驻留仅一个 256KB 块
    const run = async () => {
      try {

        if (!resp.ok || !resp.body) { res.textContent = '下载失败，已中止'; return }

          const { done, value } = await reader.read()
          if (done) break
          baseBytes += value.byteLength
        }
        controller.abort()
      } catch (e) {
        // 正常中止或连接中断
      } finally {
        finish()
      }
    }
    run()
  })

    }

    function renderMessage(msg) {
      const isMine = msg.name === myName
      timeSep(msg.time)

      const row = document.createElement('div')
      row.className = 'chat-msg-row ' + (isMine ? 'mine' : 'theirs')

      const avatar = document.createElement('div')
      avatar.className = 'chat-avatar'
      avatar.style.background = avatarColor(msg.name)
      avatar.textContent = avatarLetter(msg.name)

      const wrap = document.createElement('div')
      wrap.className = 'chat-bubble-wrap'

      const nameEl = document.createElement('div')
      nameEl.className = 'chat-name'
      nameEl.textContent = msg.name

      const bubble = document.createElement('div')
      bubble.className = 'chat-bubble'

      if (msg.text) {
        const textSpan = document.createElement('span')
        textSpan.textContent = msg.text
        bubble.appendChild(textSpan)
      }

      // 图片
      if (msg.images && msg.images.length > 0) {
        const imgsDiv = document.createElement('div')
        imgsDiv.className = 'chat-images'
        for (const imgUrl of msg.images) {
          const ext = imgUrl.split('.').pop().toLowerCase()
          const isHeic = ext === 'heic' || ext === 'heif'
          if (isHeic) {
            // HEIC/HEIF：浏览器可能无法预览
            const unsupported = document.createElement('div')
            unsupported.className = 'chat-img-unsupported'
            unsupported.textContent = '🖼 HEIF/HEIC 图片 — 该浏览器可能无法预览'
            imgsDiv.appendChild(unsupported)
          } else {
            const wrap2 = document.createElement('div')
            wrap2.className = 'chat-img-wrap'
            const img = document.createElement('img')
            img.src = imgUrl
            img.loading = 'lazy'
            img.onerror = () => { img.alt = '图片加载失败'; img.style.border = '1px solid var(--border)'; img.style.padding = '8px'; img.style.height = 'auto' }
            wrap2.appendChild(img)

            // 复制按钮
            const copyBtn = document.createElement('button')
            copyBtn.className = 'chat-img-copy'
            copyBtn.textContent = '⧉'
            copyBtn.title = '复制图片'
            copyBtn.onclick = async (e) => {
              e.stopPropagation()
              try {
                const resp = await fetch(imgUrl)
                const blob = await resp.blob()
                const mime = blob.type || 'image/png'
                if (!mime.startsWith('image/png') && !mime.startsWith('image/jpeg')) {
                  showToast('当前浏览器不支持复制此格式')
                  return
                }
                await navigator.clipboard.write([new ClipboardItem({ [mime]: blob })])
                copyBtn.textContent = '✓'
                copyBtn.classList.add('copied')
                setTimeout(() => { copyBtn.textContent = '⧉'; copyBtn.classList.remove('copied') }, 1200)
              } catch (e) {
                showToast('复制失败（HTTP 下不支持），请右键图片 → 另存为')
              }
            }
            wrap2.appendChild(copyBtn)
            imgsDiv.appendChild(wrap2)
          }
        }
        bubble.appendChild(imgsDiv)
      }

      const timeSpan = document.createElement('span')
      timeSpan.className = 'chat-time'
      timeSpan.textContent = formatTime(msg.time)
      bubble.appendChild(timeSpan)

      wrap.appendChild(nameEl)
      wrap.appendChild(bubble)
      row.appendChild(avatar)
      row.appendChild(wrap)
      messagesEl.appendChild(row)
    }

    // 滚到底
    function scrollBottom() {
      requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight })
    }

    // SSE 连接
    let evtSource = null
    function connectSSE() {
      if (evtSource) evtSource.close()
      evtSource = new EventSource('/chat/stream')
      evtSource.addEventListener('history', (e) => {
        try {
          const msgs = JSON.parse(e.data)
          messagesEl.innerHTML = ''
          lastTimeSep = 0
          for (const msg of msgs) renderMessage(msg)
          scrollBottom()
        } catch (err) { /* 忽略 */ }
      })
      evtSource.addEventListener('message', (e) => {
        try {
          const msg = JSON.parse(e.data)
          renderMessage(msg)
          scrollBottom()
        } catch (err) { /* 忽略 */ }
      })
      evtSource.addEventListener('presence', (e) => {
        try {
          const data = JSON.parse(e.data)
          statusEl.innerHTML = '<span class="online">●</span> ' + data.count + ' 人在线'
        } catch (err) { /* 忽略 */ }
      })
      // 监听权限变化（不影响聊天）
      evtSource.addEventListener('permission', (e) => {
        try {
          const perms = JSON.parse(e.data)
          // 同步到管理面板开关
          document.querySelectorAll('input[data-perm]').forEach(inp => {
            if (inp.dataset.perm in perms) inp.checked = !!perms[inp.dataset.perm]
          })
          // 聊天被禁 → 提示一次
          if (perms.chat === false) statusEl.textContent = '聊天已被管理员禁用'
        } catch (err) { /* 忽略 */ }
      })
      evtSource.onerror = () => { statusEl.textContent = '连接断开，正在重连…' }
    }
    connectSSE()

    // 昵称处理：首次发送时 prompt
    function promptName() {
      if (myName) return myName
      const input = prompt('请输入你的昵称', '访客-' + Math.random().toString(16).slice(2, 6))
      if (input && input.trim()) {
        myName = input.trim().slice(0, 20)
      } else {
        myName = '访客-' + Math.random().toString(16).slice(2, 6)
      }
      sessionStorage.setItem(myNameKey, myName)
      return myName
    }

    // 图片选择
    imgBtnEl.addEventListener('click', () => imgInputEl.click())
    imgInputEl.addEventListener('change', () => {
      for (const file of imgInputEl.files) {
        if (pendingImages.length >= 9) break
        if (file.size > 20 * 1024 * 1024) { showToast(file.name + ' 超过 20MB，已跳过'); continue }
        const url = URL.createObjectURL(file)
        pendingImages.push({ file, url })
      }
      renderPreviews()
      imgInputEl.value = ''
    })

    function renderPreviews() {
      previewBarEl.innerHTML = ''
      for (let i = 0; i < pendingImages.length; i++) {
        const item = pendingImages[i]
        const div = document.createElement('div')
        div.className = 'chat-preview-thumb'
        const img = document.createElement('img')
        img.src = item.url
        div.appendChild(img)
        const removeBtn = document.createElement('button')
        removeBtn.className = 'chat-preview-remove'
        removeBtn.textContent = '✕'
        removeBtn.onclick = () => { URL.revokeObjectURL(item.url); pendingImages.splice(i, 1); renderPreviews() }
        div.appendChild(removeBtn)
        previewBarEl.appendChild(div)
      }
    }

    // 发送消息
    formEl.addEventListener('submit', async (e) => {
      e.preventDefault()
      const text = inputEl.value.trim()
      if (!text && pendingImages.length === 0) return
      promptName()

      // 上传图片
      const imageUrls = []
      for (const item of pendingImages) {
        try {
          const ext = item.file.name.split('.').pop() || 'png'
          const upName = Date.now() + '-' + Math.random().toString(16).slice(2, 6) + '.' + ext
          const resp = await fetch('/upload/chat-img/' + encodeURIComponent(upName), { method: 'PUT', body: item.file })
          if (resp.ok) {
            imageUrls.push('/chat-img/' + upName)
          }
        } catch (err) {
          showToast('图片上传失败：' + (item.file.name || ''))
        }
      }

      // 清理预览
      for (const item of pendingImages) URL.revokeObjectURL(item.url)
      pendingImages = []
      renderPreviews()

      // 发送
      try {
        const resp = await fetch('/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: myName, text, images: imageUrls }),
        })
        if (resp.ok) {
          const data = await resp.json()
          if (data.name) { myName = data.name; sessionStorage.setItem(myNameKey, myName) }
          inputEl.value = ''
        }
      } catch (err) {
        showToast('发送失败')
      }
    })
  })()

  // ============ 系统信息 + 本机管理 ============
  ;(() => {
    const $ = (id) => document.getElementById(id)
    const isLocal = ['localhost', '127.0.0.1', '::1'].includes(location.hostname)

    let permissions = { download: true, upload: true, preview: true, hash: true, chat: true, speedtest: true }
    let serverInfo = null

    // 加载服务器信息
    async function loadInfo() {
      try {
        const resp = await fetch('/api/info')
        const json = await resp.json()
        if (!json.success) return
        serverInfo = json.data
        permissions = json.data.permissions
        $('infoIps').textContent = (json.data.localIPs || []).map(i => i.address).join(', ') || '(无)'
        $('infoPort').textContent = json.data.port
        $('infoHost').textContent = json.data.hostname
        $('infoPlatform').textContent = json.data.platform + ' / ' + json.data.arch + ' (CPU×' + json.data.cpus + ')'
        $('infoNode').textContent = json.data.nodeVersion
        // 当前访问 URL（用客户端视角）
        $('infoUrl').textContent = location.href
      } catch (e) { /* 忽略 */ }

      try {
        const resp = await fetch('/api/client-info')
        const json = await resp.json()
        if (json.success) {
          $('infoClientIp').textContent = json.data.ip
          $('infoUA').textContent = json.data.userAgent
        }
      } catch (e) { /* 忽略 */ }
    }

    // 本机管理
    const PERM_LABELS = {
      download: { name: '文件下载', desc: '下载共享目录中的文件' },
      upload: { name: '文件上传', desc: '上传文件到共享目录' },
      preview: { name: '在线预览', desc: '浏览器内联打开文件' },
      hash: { name: 'SHA-256', desc: '计算并复制文件哈希' },
      chat: { name: '局域网聊天', desc: 'SSE 实时聊天与图片' },
      speedtest: { name: '网速测试', desc: '下载/上传速度测试' },
    }
    function renderAdmin() {
      const mount = $('adminMount')
      const rows = Object.keys(PERM_LABELS).map(k => {
        const p = PERM_LABELS[k]
        return '<div class="perm-row" data-k="' + k + '">' +
          '<div class="name">' + p.name + '<small>' + p.desc + '</small></div>' +
          '<label class="switch"><input type="checkbox" data-perm="' + k + '"' + (permissions[k] ? ' checked' : '') + '><span class="slider"></span></label>' +
          '</div>'
      }).join('')
      mount.innerHTML = '<section class="admin-card" id="adminCard">' +
        '<h2>本机管理（仅 localhost 可见）</h2>' +
        '<div class="perm-list">' + rows + '</div>' +
        '<p class="subtitle" style="margin-top: 10px;">仅本机浏览器可访问，VM / 局域网设备看不到也调不了。</p>' +
        '</section>'

      mount.querySelectorAll('input[data-perm]').forEach(inp => {
        inp.addEventListener('change', async () => {
          const name = inp.dataset.perm
          const value = inp.checked
          try {
            const resp = await fetch('/api/admin/permission', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, value }),
            })
            const json = await resp.json()
            if (json.success) { showToast(PERM_LABELS[name].name + (value ? ' 已开启' : ' 已关闭')) }
            else { showToast('失败：' + (json.message || '')) }
          } catch (e) { showToast('请求失败') }
        })
      })
    }
    async function loadAdmin() {
      if (!isLocal) return
      renderAdmin()
      try {
        const resp = await fetch('/api/admin/status')
        const json = await resp.json()
        if (json.success) {
          permissions = json.data.permissions
          document.querySelectorAll('input[data-perm]').forEach(inp => { inp.checked = !!permissions[inp.dataset.perm] })
        }
      } catch (e) { showToast('加载管理状态失败') }
    }

    // 启动
    loadInfo()
    if (isLocal) loadAdmin()
  })()
</script>
</body>
</html>
